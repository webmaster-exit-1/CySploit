appId: com.pentools.cysploit
productName: CySploit
copyright: Copyright © 2025 PenTools Security
directories:
  output: release # Electron-builder output (separate from Vite's dist/)
  buildResources: build-resources
asar: false # Temporarily disable asar packaging for easier debugging
files:
  - dist/public/**/* # Client build (Vite output)
  - electron/**/* # Electron-specific main/preload scripts
  - shared/**/* # Shared types/schema used by server
  - node_modules/**/* # Project dependencies
  - package.json
extraResources:
  - from: server-build # Server built by tsc
    to: server
    filter:
      - "**/*"

# Mac OS configuration
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build-resources/icon.icns
  darkModeSupport: true

# Windows configuration
win:
  target:
    - nsis
    - portable
  icon: build-resources/icon.ico

# Linux configuration
linux:
  target:
    - AppImage
    - deb
  category: Development;Security
  icon: icons/icon.png
  desktop:
    entry:
      Name: CySploit
      Comment: Advanced Cybersecurity Suite
      Categories: Development;Security
      StartupWMClass: cysploit

publish:
  provider: github
  releaseType: draft
