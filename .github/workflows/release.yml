name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.0.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Build project
        run: yarn build

      - name: Create build archive
        run: |
          tar -czf cysploit-dist.tar.gz dist/
          zip -r cysploit-dist.zip dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: release-artifacts
          path: |
            cysploit-dist.tar.gz
            cysploit-dist.zip
          retention-days: 30

  build-electron:
    name: Build Electron App
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project first
        run: yarn build

      - name: Build Electron app
        run: yarn build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check if Electron build succeeded
        id: electron_check
        run: |
          if [ -d "dist" ] && (ls dist/*.AppImage 2>/dev/null || ls dist/*.deb 2>/dev/null); then
            echo "electron_built=true" >> $GITHUB_OUTPUT
          else
            echo "electron_built=false" >> $GITHUB_OUTPUT
            echo "Warning: Electron build artifacts not found"
          fi

      - name: Upload Electron artifacts
        if: steps.electron_check.outputs.electron_built == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: electron-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-electron]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Download Electron artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          name: electron-artifacts
          path: ./artifacts
        continue-on-error: true

      - name: Get version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes=Initial release" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## CySploit ${{ steps.get_version.outputs.version }}

            ### What's Changed
            ${{ steps.changelog.outputs.changes }}

            ### Installation

            **Electron Desktop App:**
            - Download the `.AppImage` file for Linux
            - Download the `.deb` file for Debian/Ubuntu systems

            **From Source:**
            - Download `cysploit-dist.tar.gz` or `cysploit-dist.zip`
            - Extract and follow the README for setup instructions

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.version }}
          files: |
            artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
